appId: com.spartantech.pos
productName: POS SpArTaN Tech
copyright: Copyright © 2026 SpArTaN Tech

directories:
  buildResources: build
  output: dist-electron

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!drizzle.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json}'
  - '!.data'
  - '!.data/*'

# Las migraciones SQL se resuelven en runtime desde process.resourcesPath/migrations
extraResources:
  - from: resources/migrations
    to: migrations

asarUnpack:
  - resources/**
  - '**/*.node'

win:
  executableName: pos-spartan-tech
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - es_ES
  language: '3082'
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

npmRebuild: true

publish: null
