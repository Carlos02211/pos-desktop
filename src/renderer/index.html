<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>POS SpArTaN Tech</title>
    <!--
      El Renderer sólo carga scripts propios y habla HTTP/WS con el servidor
      Fastify local (:3001). Las imágenes de producto se sirven desde ese origen.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: http://localhost:3001;
               font-src 'self' data:;
               connect-src 'self' http://localhost:3001 ws://localhost:3001 http://localhost:* ws://localhost:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
