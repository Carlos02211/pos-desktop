<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin esto, celulares y tabletas dibujan la app como si fueran una pantalla de PC. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Punto de venta</title>
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- El manifest (instalar como app) lo agrega main.tsx sólo cuando se sirve por http(s). -->
    <!--
      El Renderer sólo carga scripts propios y habla HTTP/WS con el servidor
      Fastify local (:3001). Las imágenes de producto se sirven desde ese origen.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: http://localhost:3001;
               font-src 'self' data:;
               connect-src 'self' http://localhost:3001 ws://localhost:3001 http://localhost:* ws://localhost:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
