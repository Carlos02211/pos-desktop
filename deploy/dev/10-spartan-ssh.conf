# SSH de la PC de desarrollo — sólo para generar licencias desde el celular (vía Tailscale).
# Instalar: sudo install -m 644 deploy/dev/10-spartan-ssh.conf /etc/ssh/sshd_config.d/
# El "10-" hace que gane sobre los demás archivos (en sshd vale el PRIMER valor leído).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers spartan
MaxAuthTries 3
